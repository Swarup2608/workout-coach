<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-labelledby="t d">
  <title id="t">StarkFitIQ architecture</title>
  <desc id="d">Animated architecture diagram. The Next.js web app calls the Express API over cookies and CSRF. The API's routes use domain services (starter plan from the workout library, plan parser, metrics, constraints, AI client) and a per-user repository on MongoDB. The AI client calls the user's own AI provider; separately, the user can copy a check-in to a Claude Project by hand and import the score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset="1" stop-color="#0f1122"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161929"/>
      <stop offset="1" stop-color="#0f111c"/>
    </linearGradient>
    <radialGradient id="g1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".25"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#818cf8"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
    <marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d97757"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".03"/>
    </pattern>
    <style>
      .f { font-family: Inter, "SF Pro Display", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 8 10; animation: flow 1.1s linear infinite; }
      .flowR { stroke-dasharray: 8 10; animation: flow 1.1s linear infinite reverse; }
      .slow { stroke-dasharray: 3 9; animation: flow 2.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -18; } }
      .in { opacity: 0; animation: in .8s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      .blink { animation: blink 2.4s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: .35; } }
      .hl { animation: hl 9s ease-in-out infinite; }
      @keyframes hl { 0%, 20%, 100% { fill: #1b1f33; } 6%, 14% { fill: #262b4a; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .in { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="700" fill="url(#bg)"/>
  <rect width="1280" height="700" fill="url(#grid)"/>
  <circle cx="200" cy="120" r="300" fill="url(#g1)"/>
  <circle cx="1120" cy="620" r="280" fill="url(#g2)"/>

  <g class="f">
    <text class="in" x="56" y="66" font-size="30" font-weight="800" fill="#f4f4f5" letter-spacing="-.5">How StarkFitIQ fits together</text>
    <text class="in" style="animation-delay:.1s" x="56" y="94" font-size="15" fill="#a1a1aa">Next.js client · Express API · rule-based plans and deterministic metrics · MongoDB · bring-your-own AI</text>
  </g>

  <!-- ── Client ── -->
  <g class="in f" style="animation-delay:.2s">
    <rect x="56" y="140" width="300" height="400" rx="20" fill="url(#panel)" stroke="#2a2e45"/>
    <text x="80" y="176" font-size="12" font-weight="700" fill="#818cf8" letter-spacing="2">WEB APP</text>
    <text x="80" y="202" font-size="20" font-weight="800" fill="#fff">Next.js 16 · React 19</text>
    <g font-size="14" fill="#e4e4e7">
      <rect class="hl" style="animation-delay:0s" x="80" y="224" width="252" height="36" rx="10" fill="#1b1f33"/>
      <text x="96" y="247">Onboarding · 8-step setup</text>
      <rect class="hl" style="animation-delay:1.5s" x="80" y="268" width="252" height="36" rx="10" fill="#1b1f33"/>
      <text x="96" y="291">Dashboard · daily check-in</text>
      <rect class="hl" style="animation-delay:3s" x="80" y="312" width="252" height="36" rx="10" fill="#1b1f33"/>
      <text x="96" y="335">Log · History · Plan</text>
      <rect class="hl" style="animation-delay:4.5s" x="80" y="356" width="252" height="36" rx="10" fill="#1b1f33"/>
      <text x="96" y="379">Coach chat (streaming)</text>
      <rect class="hl" style="animation-delay:6s" x="80" y="400" width="252" height="36" rx="10" fill="#1b1f33"/>
      <text x="96" y="423">Profile · kg/lb · AI key</text>
    </g>
    <text class="m" x="80" y="472" font-size="12" fill="#71717a">lib/api.ts · cookies + CSRF</text>
    <text class="m" x="80" y="492" font-size="12" fill="#71717a">lib/units.ts · kg ⇄ lb</text>
    <text class="m" x="80" y="512" font-size="12" fill="#71717a">lib/domain.ts · shared types</text>
  </g>

  <!-- client ⇄ api -->
  <g class="f">
    <path class="flow" d="M360 300 H452" stroke="#818cf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path class="flowR" d="M360 340 H452" stroke="#34d399" stroke-width="3" fill="none" marker-start="url(#arrowG)"/>
    <text x="406" y="288" text-anchor="middle" font-size="11" fill="#a5b4fc">REST · SSE</text>
    <text x="406" y="362" text-anchor="middle" font-size="11" fill="#6ee7b7">JSON</text>
  </g>

  <!-- ── API ── -->
  <g class="in f" style="animation-delay:.35s">
    <rect x="456" y="140" width="330" height="400" rx="20" fill="url(#panel)" stroke="#2a2e45"/>
    <text x="480" y="176" font-size="12" font-weight="700" fill="#818cf8" letter-spacing="2">API</text>
    <text x="480" y="202" font-size="20" font-weight="800" fill="#fff">Express 5 · Zod</text>
    <rect x="480" y="222" width="282" height="64" rx="12" fill="#1b1f33" stroke="#2f3452"/>
    <text x="496" y="246" font-size="14" font-weight="700" fill="#e4e4e7">Auth</text>
    <text x="496" y="268" font-size="12" fill="#a1a1aa">Argon2id · JWT cookies · rotation · CSRF</text>
    <rect x="480" y="296" width="282" height="140" rx="12" fill="#1b1f33" stroke="#2f3452"/>
    <text x="496" y="320" font-size="14" font-weight="700" fill="#e4e4e7">Routes</text>
    <g class="m" font-size="12" fill="#c7d2fe">
      <text x="496" y="344">/profile  /profile/onboarding</text>
      <text x="496" y="364">/checkins/:date  /plans</text>
      <text x="496" y="384">/sessions  /metrics  /scores</text>
      <text x="496" y="404">/handoff  /chat  /settings/ai</text>
      <text x="496" y="424" fill="#71717a">every query scoped to the user</text>
    </g>
    <text x="480" y="468" font-size="12" fill="#a1a1aa">helmet · strict CORS · rate limits</text>
    <text x="480" y="488" font-size="12" fill="#a1a1aa">bundled with esbuild</text>
    <circle class="blink" cx="760" cy="172" r="5" fill="#34d399"/>
  </g>

  <!-- api → services -->
  <path class="flow" d="M790 250 H880" stroke="#818cf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <!-- api → db -->
  <path class="flow" d="M620 544 V600" stroke="#34d399" stroke-width="3" fill="none" marker-end="url(#arrowG)"/>

  <!-- ── Services ── -->
  <g class="in f" style="animation-delay:.5s">
    <rect x="884" y="140" width="340" height="300" rx="20" fill="url(#panel)" stroke="#2a2e45"/>
    <text x="908" y="176" font-size="12" font-weight="700" fill="#818cf8" letter-spacing="2">DOMAIN SERVICES</text>
    <text x="908" y="202" font-size="20" font-weight="800" fill="#fff">Rules first, AI optional</text>
    <g font-size="13">
      <rect x="908" y="220" width="292" height="44" rx="10" fill="#10261f" stroke="#1f5a45"/>
      <text x="922" y="240" font-weight="700" fill="#a7f3d0">starterPlan.ts</text>
      <text x="922" y="256" font-size="11" fill="#6ee7b7">answers + workouts.json → your week</text>
      <rect x="908" y="272" width="142" height="40" rx="10" fill="#1b1f33" stroke="#2f3452"/>
      <text x="922" y="297" fill="#e4e4e7">planParser</text>
      <rect x="1058" y="272" width="142" height="40" rx="10" fill="#1b1f33" stroke="#2f3452"/>
      <text x="1072" y="297" fill="#e4e4e7">metrics</text>
      <rect x="908" y="320" width="142" height="40" rx="10" fill="#1b1f33" stroke="#2f3452"/>
      <text x="922" y="345" fill="#e4e4e7">constraints</text>
      <rect x="1058" y="320" width="142" height="40" rx="10" fill="#1b1f33" stroke="#2f3452"/>
      <text x="1072" y="345" fill="#e4e4e7">day import</text>
      <rect x="908" y="368" width="292" height="44" rx="10" fill="#2a1a14" stroke="#6b3a28"/>
      <text x="922" y="388" font-weight="700" fill="#f5c4b1">ai.ts</text>
      <text x="922" y="404" font-size="11" fill="#e8a58b">per-user key · AES-256-GCM · SSRF-checked</text>
    </g>
  </g>

  <!-- ai → provider -->
  <path class="flow" d="M1054 444 V506" stroke="#d97757" stroke-width="3" fill="none" marker-end="url(#arrowW)"/>
  <g class="in f" style="animation-delay:.65s">
    <rect x="884" y="510" width="340" height="80" rx="18" fill="#1d1410" stroke="#6b3a28"/>
    <text x="908" y="542" font-size="16" font-weight="800" fill="#fbd5c5">Your AI provider</text>
    <text x="908" y="566" font-size="12" fill="#e8a58b">Claude · OpenAI · Gemini · Groq · Mistral · OpenRouter</text>
  </g>

  <!-- ── MongoDB ── -->
  <g class="in f" style="animation-delay:.6s">
    <rect x="456" y="604" width="330" height="84" rx="18" fill="#0f1f1a" stroke="#1f5a45"/>
    <ellipse cx="496" cy="632" rx="18" ry="6" fill="none" stroke="#34d399" stroke-width="2"/>
    <path d="M478 632 v20 a18 6 0 0 0 36 0 v-20" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="528" y="630" font-size="16" font-weight="800" fill="#a7f3d0">MongoDB</text>
    <text class="m" x="528" y="652" font-size="11" fill="#6ee7b7">users · profiles · plans</text>
    <text class="m" x="528" y="670" font-size="11" fill="#6ee7b7">sessions · scores · checkins</text>
  </g>

  <!-- Claude Project manual handoff -->
  <path class="slow" d="M206 544 V574" stroke="#d97757" stroke-width="2.5" fill="none" marker-end="url(#arrowW)" opacity=".9"/>
  <path class="slow" d="M344 605 H420 V470 H450" stroke="#d97757" stroke-width="2.5" fill="none" marker-end="url(#arrowW)" opacity=".9"/>
  <text class="f" x="372" y="596" font-size="10" fill="#e8a58b">import</text>
  <g class="f">
    <rect x="70" y="580" width="270" height="50" rx="12" fill="#1d1410" stroke="#6b3a28" stroke-dasharray="4 4"/>
    <text x="86" y="601" font-size="13" font-weight="700" fill="#fbd5c5">Claude Project (no API key)</text>
    <text x="86" y="619" font-size="11" fill="#e8a58b">copy check-in → paste reply → import score</text>
  </g>
</svg>
