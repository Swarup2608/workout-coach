<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">StarkFitIQ — AI workout coach</title>
  <desc id="d">Animated banner: the StarkFitIQ wordmark and tagline beside a dashboard card with a week score ring filling to 86, an onboarding progress bar filling green, and weekly training bars rising.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070b"/>
      <stop offset="1" stop-color="#0d0f1c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151827"/>
      <stop offset="1" stop-color="#0f111c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      .f { font-family: Inter, "SF Pro Display", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .drift1 { animation: drift1 14s ease-in-out infinite alternate; }
      .drift2 { animation: drift2 18s ease-in-out infinite alternate; }
      @keyframes drift1 { to { transform: translate(90px, 30px); } }
      @keyframes drift2 { to { transform: translate(-80px, -24px); } }
      .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .score { stroke-dasharray: 377; stroke-dashoffset: 377; animation: score 2.4s cubic-bezier(.3,.7,.2,1) .6s forwards, breathe 4s ease-in-out 3s infinite; }
      @keyframes score { to { stroke-dashoffset: 53; } }
      @keyframes breathe { 50% { opacity: .75; } }
      .seg { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: fill .45s ease-out forwards; }
      @keyframes fill { to { transform: scaleX(1); } }
      .grow { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow 1s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes grow { to { transform: scaleY(1); } }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0; } }
      .shine { animation: shine 6s ease-in-out 2s infinite; }
      @keyframes shine { 0% { transform: translateX(-420px); } 40%,100% { transform: translateX(520px); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .rise { opacity: 1; } .seg, .grow { transform: none; } .score { stroke-dashoffset: 53; }
      }
    </style>
    <clipPath id="cardClip"><rect x="736" y="58" width="480" height="324" rx="22"/></clipPath>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <circle class="drift1" cx="300" cy="80" r="320" fill="url(#glowA)"/>
  <circle class="drift2" cx="1080" cy="420" r="300" fill="url(#glowB)"/>

  <!-- Brand -->
  <g class="f">
    <g class="rise" style="animation-delay:.05s">
      <path d="M92 104 l34 -19.6 34 19.6 v39.2 l-34 19.6 -34 -19.6z" fill="#11132a" stroke="#818cf8" stroke-width="3"/>
      <path d="M140 108c-3-6-9-9-16-9-9 0-15 5-15 11 0 14 31 8 31 22 0 7-7 12-16 12-8 0-14-4-17-10" fill="none" stroke="#e0e7ff" stroke-width="5" stroke-linecap="round"/>
      <text x="180" y="138" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1">StarkFit<tspan fill="#818cf8">IQ</tspan></text>
    </g>
    <text class="rise" style="animation-delay:.2s" x="92" y="214" font-size="40" font-weight="800" fill="#f4f4f5" letter-spacing="-1">Your training, scored</text>
    <text class="rise" style="animation-delay:.3s" x="92" y="260" font-size="40" font-weight="800" fill="#f4f4f5" letter-spacing="-1">intelligently.</text>
    <text class="rise" style="animation-delay:.42s" x="92" y="300" font-size="18" fill="#a1a1aa">Plan your training · Track every rep · Score your week · Get stronger</text>

    <g class="rise" style="animation-delay:.6s" font-size="14" font-weight="600">
      <rect x="92" y="326" width="132" height="34" rx="17" fill="#6366f1" fill-opacity=".14" stroke="#818cf8" stroke-opacity=".5"/>
      <text x="158" y="348" text-anchor="middle" fill="#c7d2fe">Guided setup</text>
      <rect x="234" y="326" width="180" height="34" rx="17" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/>
      <text x="324" y="348" text-anchor="middle" fill="#a7f3d0">Rule-based starter plan</text>
      <rect x="424" y="326" width="126" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="487" y="348" text-anchor="middle" fill="#e4e4e7">Daily check-in</text>
      <rect x="560" y="326" width="120" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="620" y="348" text-anchor="middle" fill="#e4e4e7">AI coach chat</text>
    </g>
  </g>

  <!-- Dashboard card -->
  <g class="rise f" style="animation-delay:.35s" filter="url(#soft)">
    <rect x="736" y="58" width="480" height="324" rx="22" fill="url(#card)" stroke="#2a2e45"/>
    <g clip-path="url(#cardClip)">
      <g transform="skewX(-18)"><rect class="shine" x="736" y="0" width="90" height="440" fill="#ffffff" fill-opacity=".04"/></g>
    </g>

    <!-- score ring -->
    <circle cx="840" cy="170" r="60" fill="none" stroke="#23263a" stroke-width="14"/>
    <circle class="score" cx="840" cy="170" r="60" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" transform="rotate(-90 840 170)"/>
    <text x="840" y="172" text-anchor="middle" font-size="40" font-weight="800" fill="#fff">86</text>
    <text x="840" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#34d399">GRADE A−</text>
    <text x="772" y="90" font-size="11" font-weight="700" fill="#71717a" letter-spacing="2">WEEK SCORE</text>

    <!-- weekly bars -->
    <text x="940" y="90" font-size="11" font-weight="700" fill="#71717a" letter-spacing="2">VOLUME THIS WEEK</text>
    <g>
      <rect class="grow" style="animation-delay:.9s"  x="944"  y="150" width="26" height="74" rx="6" fill="url(#bar)"/>
      <rect class="grow" style="animation-delay:1.0s" x="980"  y="124" width="26" height="100" rx="6" fill="url(#bar)"/>
      <rect x="1016" y="212" width="26" height="12" rx="6" fill="#23263a"/>
      <rect class="grow" style="animation-delay:1.1s" x="1052" y="136" width="26" height="88" rx="6" fill="url(#bar)"/>
      <rect class="grow" style="animation-delay:1.2s" x="1088" y="112" width="26" height="112" rx="6" fill="#34d399"/>
      <rect x="1124" y="212" width="26" height="12" rx="6" fill="#23263a"/>
      <rect x="1160" y="212" width="26" height="12" rx="6" fill="#23263a"/>
    </g>
    <g font-size="11" fill="#71717a" text-anchor="middle">
      <text x="957" y="242">M</text><text x="993" y="242">T</text><text x="1029" y="242">W</text><text x="1065" y="242">T</text><text x="1101" y="242">F</text><text x="1137" y="242">S</text><text x="1173" y="242">S</text>
    </g>

    <!-- onboarding progress -->
    <line x1="764" y1="270" x2="1188" y2="270" stroke="#23263a"/>
    <circle cx="772" cy="296" r="8" fill="#34d399"/>
    <path d="M768 296l3 3 5-6" fill="none" stroke="#062e1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="788" y="301" font-size="14" fill="#a1a1aa"><tspan fill="#34d399" font-weight="700">7</tspan> of 8 steps completed · <tspan fill="#f87171" font-weight="700">1</tspan> skipped</text>
    <g>
      <rect class="seg" style="animation-delay:1.2s" x="764"  y="316" width="48" height="8" rx="4" fill="#34d399"/>
      <rect class="seg" style="animation-delay:1.35s" x="818"  y="316" width="48" height="8" rx="4" fill="#34d399"/>
      <rect class="seg" style="animation-delay:1.5s" x="872"  y="316" width="48" height="8" rx="4" fill="#34d399"/>
      <rect class="seg" style="animation-delay:1.65s" x="926"  y="316" width="48" height="8" rx="4" fill="#34d399"/>
      <rect class="seg" style="animation-delay:1.8s" x="980"  y="316" width="48" height="8" rx="4" fill="#34d399"/>
      <rect class="seg" style="animation-delay:1.95s" x="1034" y="316" width="48" height="8" rx="4" fill="#34d399"/>
      <rect class="seg" style="animation-delay:2.1s" x="1088" y="316" width="48" height="8" rx="4" fill="#f87171"/>
      <rect class="seg" style="animation-delay:2.25s" x="1142" y="316" width="46" height="8" rx="4" fill="#34d399"/>
    </g>
    <text x="764" y="356" font-size="13" fill="#71717a">Starter plan ready · 4 days · Upper / Lower</text>
    <circle class="pulse" cx="1180" cy="352" r="5" fill="#34d399"/>
    <circle cx="1180" cy="352" r="5" fill="#34d399"/>
  </g>
</svg>
