<!doctype html>
<!--
  StarkFitIQ feature campaigns (banner-design skill).
  4 features × 3 art directions × 5 sizes = 60 artboards, generated by the script at the bottom.
    features:   ai-coach, nutrition, readiness, live-workout   (copy checked against features.md)
    directions: editorial (warm gold-toned photo, magazine hairlines, one fact as a caption)
                scorecard (steel-toned photo under a product UI card)
                forged    (chrome/gold logo as hero over a gold-toned photo)
    sizes:      LinkedIn 1584×396, Google 300×250 and 728×90, Instagram 1080×1080 and 1080×1920
  Brand: warm graphite + gold + steel (client/src/app/globals.css), Uncut Sans, client/public/brand/LogoNav.png.
  Safe zones: Instagram story content between y=250 and y=1580; LinkedIn keeps text clear of the
  profile photo (bottom-left), and has no button because the banner isn't clickable.
  Photos (client/public/media, Unsplash License): woman-carry, bowl (cut out as a plate), floor-mobility, barbell-floor.
  Preview one feature: banners.html?f=nutrition
  Export: node assets/banners/feature-campaigns/export.cjs → {feature}/{style}-{w}x{h}.png
-->
<html lang="en">

  .card .hd b { color: var(--text); font-weight: 600; font-size: 21px; }
  .card .tag { margin-left: auto; font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .ava { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(212,180,131,.14); color: var(--gold); border: 1px solid var(--gold-line); flex-shrink: 0; }
  .ava svg { width: 22px; height: 22px; }
  .card .msg { color: var(--text); font-size: 22px; line-height: 1.38; }
  .prop { display: flex; justify-content: space-between; margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
  .prop b { color: var(--gold-l); font-weight: 600; }
  .acts { display: flex; gap: 10px; margin-top: 16px; }
  .chip { padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--line-2); font-weight: 600; font-size: 17px; color: var(--text-2); }
  .chip.on { border-color: var(--gold); color: var(--gold); background: rgba(212,180,131,.1); }
  .nut { display: flex; gap: 26px; align-items: center; }
  .mring { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
  .mring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .mring div { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; color: var(--muted); }
  .mring div b { color: var(--text); font-size: 32px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .macros { flex: 1; display: grid; gap: 14px; }
  .macros > div { display: grid; grid-template-columns: 1fr auto; gap: 6px; font-size: 17px; }
  .macros b { color: var(--text); font-weight: 600; }
  .macros i { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--line); position: relative; overflow: hidden; }
  .macros i::after { content: ""; position: absolute; inset: 0; width: var(--w); border-radius: inherit; background: linear-gradient(90deg, var(--gold-d), var(--gold-l)); }
  .food { display: flex; align-items: center; gap: 14px; margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
  .food span { color: var(--muted); font-size: 15px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .food p { flex: 1; color: var(--text); }
  .food b { color: var(--gold-l); font-weight: 600; }
  .rows { display: grid; gap: 12px; }
  .rows > div { display: flex; align-items: center; justify-content: space-between; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 22px; height: 22px; border-radius: 50%; background: var(--line); }
  .dots i.f { background: var(--steel); }
  .verdict { display: flex; gap: 16px; align-items: flex-start; margin-top: 20px; padding: 16px 18px; border-radius: 16px; background: rgba(127,176,138,.12); border: 1.5px solid rgba(127,176,138,.45); }
  .verdict .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--good); box-shadow: 0 0 16px var(--good); margin-top: 7px; flex-shrink: 0; }
  .verdict b { display: block; color: var(--good); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .verdict p { font-size: 17px; margin-top: 4px; }
  .sets { display: grid; gap: 8px; }
  .sets > div { display: grid; grid-template-columns: 34px 1fr auto 34px; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); }
  .sets > div.cur { border-color: var(--gold-line); background: rgba(212,180,131,.07); }
  .sets .n { color: var(--muted); font-weight: 600; }
  .sets .w { color: var(--text); font-weight: 600; }
  .sets .e { font-size: 15px; font-weight: 600; color: var(--muted); }
  .tick { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--good); color: #0e1a11; }
  .tick.no { background: transparent; border: 2px solid var(--gold-line); }
  .tick svg { width: 18px; height: 18px; }
  .rest { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  .rest b { color: var(--gold); font-weight: 600; font-size: 24px; letter-spacing: -0.02em; }
  .rest i { flex: 1; height: 8px; border-radius: 99px; background: var(--line); position: relative; overflow: hidden; }
  .rest i::after { content: ""; position: absolute; inset: 0; width: 62%; background: linear-gradient(90deg, var(--gold-d), var(--gold-l)); border-radius: inherit; }
  .hint { margin-top: 14px; font-size: 17px; color: var(--muted); }
  .hint b { color: var(--gold-l); font-weight: 600; }

  /* mini card for the small ad sizes */
  .mini { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: rgba(22,22,23,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; color: var(--text-2); line-height: 1.3; }
  .mini b { display: block; color: var(--text); font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .mini .ava { width: 30px; height: 30px; border-radius: 9px; } .mini .ava svg { width: 16px; height: 16px; }
  .mini .mring { width: 40px; height: 40px; }
  .mini .verdict-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--good); box-shadow: 0 0 12px var(--good); flex-shrink: 0; margin: 0 4px; }
  .mini .chip { padding: 5px 9px; font-size: 12px; border-radius: 8px; margin-left: auto; white-space: nowrap; }
  .mini .gold { color: var(--gold); font-weight: 600; font-size: 17px; margin-left: auto; white-space: nowrap; }
  .s-mr .mini b { white-space: nowrap; }
  .s-lb .mini { white-space: nowrap; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0c497" /><stop offset="1" stop-color="#8a6a35" /></linearGradient></defs>
</svg>

<script>
const M = "../../../client/public/media/";
const LOGO = "../../../client/public/brand/LogoNav.png";
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const SPARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/></svg>';
const TICK = '<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';
const ring = (pct, r = 40) => { const c = 2 * Math.PI * r; return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="#2a2a2d" stroke-width="9"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="url(#g-gold)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * pct).toFixed(1)} ${c.toFixed(1)}"/></svg>`; };
const dots = (n) => `<span class="dots">${[0,1,2,3,4].map(i => `<i class="${i < n ? "f" : ""}"></i>`).join("")}</span>`;

const FEATURES = {
  "ai-coach": {
    photo: "woman-carry.jpg", pos: "70% 30%", posMr: "62% 40%", b: 1,
    kicker: "AI coach", hw: "A coach that knows", hg: "your week.",
    sub: "It reads your plan, logs and readiness, and suggests changes you apply in one tap.",
    cta: "Meet your coach", stat: ["1 tap", "To apply", "Undo any time"],
    card: `<div class="card"><div class="hd"><span class="ava">${SPARK}</span><b>AI coach</b><span class="tag">On Plan</span></div>
      <p class="msg">Your squats felt easy two sessions running. Add 2.5 kg on Friday?</p>
      <div class="prop"><span>Back squat</span><b>100 → 102.5 kg</b></div>
      <div class="acts"><span class="chip on">Apply to plan</span><span class="chip">Apply today</span></div></div>`,
    mini: `<div class="mini"><span class="ava">${SPARK}</span><div><b>Add 2.5 kg to squats?</b>From your AI coach</div><span class="chip on">Apply</span></div>`,
  },
  nutrition: {
    photo: "bowl.jpg", plate: true,
    kicker: "Indian-first nutrition", hw: "Made for roti,", hg: "dal and katori.",
    sub: "174 Indian foods in home portions, photo logging and targets that adapt to your trend.",
    cta: "Track your meals", stat: ["174", "Indian foods", "In home portions"],
    card: `<div class="card"><div class="hd"><b>Today</b><span class="tag">Training day</span></div>
      <div class="nut"><div class="mring">${ring(0.78)}<div><b>1,640</b>of 2,100 kcal</div></div>
      <div class="macros"><div>Protein <b>92 / 120 g</b><i style="--w:77%"></i></div><div>Carbs <b>180 / 240 g</b><i style="--w:75%"></i></div><div>Fat <b>48 / 65 g</b><i style="--w:74%"></i></div></div></div>
      <div class="food"><span>Lunch</span><p>2 roti · 1 katori dal</p><b>420 kcal</b></div></div>`,
    mini: `<div class="mini"><span class="mring">${ring(0.78)}</span><div><b>1,640 / 2,100 kcal</b>2 roti · 1 katori dal</div></div>`,
  },
  readiness: {
    photo: "floor-mobility.jpg", pos: "30% 56%", b: 0.46,
    kicker: "Daily check-in", hw: "Push today,", hg: "or go lighter?",
    sub: "Six one-tap answers and a readiness verdict before you train.",
    cta: "Check in today", stat: ["6", "One-tap answers", "Sleep, energy, soreness…"],
    card: `<div class="card"><div class="hd"><b>Daily check-in</b><span class="tag">Today</span></div>
      <div class="rows"><div>Sleep ${dots(4)}</div><div>Energy ${dots(4)}</div><div>Soreness ${dots(1)}</div></div>
      <div class="verdict"><span class="dot"></span><div><b>Ready to push</b><p>Well recovered. Aim for the top of your rep range.</p></div></div></div>`,
    mini: `<div class="mini"><span class="verdict-dot"></span><div><b>Ready to push</b>Today's readiness</div></div>`,
  },
  "live-workout": {
    photo: "barbell-floor.jpg", pos: "42% 45%", posMr: "52% 30%", b: 1,
    kicker: "Live workout", hw: "Every set,", hg: "logged in a tap.",
    sub: "Last time's weights filled in, a rest timer that beeps, and effort that becomes next time's hint.",
    cta: "Start a workout", stat: ["90 s", "Rest timer", "Beeps when it's time"],
    card: `<div class="card"><div class="hd"><b>Deadlift</b><span class="tag">24:18</span></div>
      <div class="sets"><div><span class="n">1</span><span class="w">120 kg × 5</span><span class="e">Easy</span>${TICK}</div>
      <div><span class="n">2</span><span class="w">120 kg × 5</span><span class="e">Good</span>${TICK}</div>
      <div class="cur"><span class="n">3</span><span class="w">120 kg × 5</span><span class="e"></span><span class="tick no"></span></div></div>
      <div class="rest">Rest <b>1:30</b><i></i></div>
      <p class="hint"><b>Felt easy last time:</b> add a little weight.</p></div>`,
    mini: `<div class="mini"><div><b>Set 3 · 120 kg × 5</b>Deadlift</div><span class="gold">Rest 1:30</span></div>`,
  },
};

const SIZES = { li: [1584, 396], mr: [300, 250], lb: [728, 90], post: [1080, 1080], story: [1080, 1920] };
const STYLES = ["editorial", "scorecard", "forged"];
const CLS = { editorial: "ed", scorecard: "sc", forged: "fo" };
const only = new URLSearchParams(location.search).get("f");

for (const [fid, f] of Object.entries(FEATURES)) {
  if (only && only !== fid) continue;
  for (const style of STYLES) {
    for (const [sz, [w, h]] of Object.entries(SIZES)) {
      const small = sz === "mr" || sz === "lb";
      const el = document.createElement("section");
      el.className = `ab s-${sz} ${CLS[style]} f-${fid}`;
      el.dataset.out = `${fid}/${style}-${w}x${h}.png`;
      el.style.setProperty("--pos", f.pos || "50% 50%");
      el.style.setProperty("--b", f.b ?? 1);
      if (f.posMr) el.style.setProperty("--pos-mr", f.posMr);
      const photo = f.plate
        ? `<div class="pbox plate-mode"><div class="plate"><img src="${M}${f.photo}" alt="" /></div></div>`
        : `<div class="pbox"><img src="${M}${f.photo}" alt="" /></div>`;
      const ui = style === "scorecard" ? `<div class="ui">${small ? f.mini : f.card}</div>` : "";
      const stat = style === "editorial" ? `<div class="stat"><b>${f.stat[0]}</b><span><i>${f.stat[1]}</i>${f.stat[2]}</span></div>` : "";
      el.innerHTML = `${photo}<div class="shade"></div>${style === "forged" ? '<div class="glow"></div>' : ""}
        <div class="safe">
          <img class="logo" src="${LOGO}" alt="StarkFitIQ" />
          <span class="k">${f.kicker}</span><i class="r1"></i>
          <h1 class="h">${f.hw}${sz === "lb" ? " " : "<br />"}<em>${f.hg}</em></h1>
          ${stat}${ui}<i class="r2"></i>
          <p class="sub">${f.sub}</p>
          <span class="cta">${f.cta} ${ARROW}</span>
        </div>`;
      document.body.appendChild(el);
    }
  }
}
</script>
</body>
</html>
